name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Also build macOS and Windows (uses more Actions minutes)"
        type: boolean
        default: true

env:
  MODEL: ggml-small.en-q5_1.bin

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: lib
          key: linux-lib-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL }}
          key: whisper-${{ env.MODEL }}

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Provide empty API key
        run: cp app/apikey.h.example app/apikey.h

      - name: Show runner resources
        run: free -h || true; df -h . || true; nproc || true

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --parallel 2

      - name: Kernel and resource check
        if: always()
        run: |
          free -h || true
          df -h . || true
          sudo dmesg 2>/dev/null | grep -iE "out of memory|killed process" | tail -20             || echo "no OOM entries in kernel log"

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: warn

  macos:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.all_platforms)
      || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: lib
          key: macos-lib-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL }}
          key: whisper-${{ env.MODEL }}

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Provide empty API key
        run: cp app/apikey.h.example app/apikey.h

      - name: Show runner resources
        run: free -h || true; df -h . || true; nproc || true

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --parallel 2

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*.tar.gz
          if-no-files-found: warn

  windows:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.all_platforms)
      || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git

      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: lib
          key: windows-lib-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL }}
          key: whisper-${{ env.MODEL }}

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Provide empty API key
        run: cp app/apikey.h.example app/apikey.h

      - name: Show runner resources
        run: free -h || true; df -h . || true; nproc || true

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --parallel 2

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: warn

  windows-cleanroom:
    needs: windows
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.all_platforms)
      || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: pkg

      - name: Prove this machine has no MSYS2 on PATH
        shell: pwsh
        run: |
          $bad = $env:PATH -split ';' | Where-Object { $_ -like '*msys64*' -or $_ -like '*mingw*' }
          if ($bad) {
            Write-Host "Stripping toolchain entries: $($bad -join ', ')"
            $clean = ($env:PATH -split ';' | Where-Object { $_ -notlike '*msys64*' -and $_ -notlike '*mingw*' }) -join ';'
            "PATH=$clean" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "PATH already free of MSYS2/MinGW."
          }

      - name: Extract the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkg -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "no zip artifact found" }
          Write-Host "Extracting $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath app -Force
          $sub = Get-ChildItem app -Directory
          $root = if ($sub.Count -eq 1) { $sub[0].FullName } else { (Resolve-Path app).Path }
          Write-Host "App dir: $root"
          "APPDIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Load every bundled DLL with the real Windows loader
        shell: pwsh
        run: |
          $dir = $env:APPDIR
          $env:PATH = "$dir;$env:PATH"
          $ok = 0; $fail = 0
          foreach ($f in Get-ChildItem $dir -Recurse -Filter *.dll) {
            try {
              [void][System.Runtime.InteropServices.NativeLibrary]::Load($f.FullName)
              $ok++
            } catch {
              $rel = $f.FullName.Substring($dir.Length).TrimStart('')
              Write-Host "FAIL  $rel : $($_.Exception.InnerException.Message)"
              $fail++
            }
          }
          Write-Host ""
          Write-Host "DLLs loaded OK : $ok"
          Write-Host "DLLs failed    : $fail"
          if ($fail -gt 0) { throw "$fail DLL(s) could not be loaded on a clean machine" }

      - name: Launch the app and check it does not die from a missing DLL
        shell: pwsh
        run: |
          $dir = $env:APPDIR
          foreach ($name in @('Ulti-Jarvis-Settings.exe', 'Ulti-Jarvis-Daemon.exe')) {
            $exe = Join-Path $dir $name
            if (-not (Test-Path $exe)) { throw "missing executable: $name" }
            Write-Host "--- starting $name ---"
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 10
            if ($p.HasExited) {
              $c = $p.ExitCode
              Write-Host "$name exited with $c (0x$('{0:X8}' -f $c))"
              if ($c -eq -1073741515) { throw "$name : STATUS_DLL_NOT_FOUND - the package is missing a DLL" }
              if ($c -eq -1073741511) { throw "$name : STATUS_ENTRYPOINT_NOT_FOUND - a bundled DLL is the wrong version" }
              Write-Host "$name exited, but not from a missing DLL (CI has no audio device or desktop)."
            } else {
              Write-Host "$name still running after 10s - started cleanly."
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }

  macos-cleanroom:
    needs: macos
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.all_platforms)
      || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: pkg

      - name: Extract the package
        run: |
          set -e
          tgz=$(find pkg -name '*.tar.gz' | head -1)
          test -n "$tgz" || { echo "no tarball in artifact"; exit 1; }
          mkdir -p app && tar xzf "$tgz" -C app
          bundle=$(find app -name '*.app' -maxdepth 3 -type d | head -1)
          if [ -n "$bundle" ]; then
            root="$bundle/Contents/MacOS"
            echo "BUNDLE=$(cd "$bundle" && pwd)" >> "$GITHUB_ENV"
          else
            root=$(find app -mindepth 1 -maxdepth 1 -type d | head -1)
            test -n "$root" || root=app
          fi
          echo "APPROOT=$(cd "$root" && pwd)" >> "$GITHUB_ENV"
          echo "binaries in $root"
          ls "$root" | head -20

      - name: Find dependencies that live outside the package
        run: |
          set -e
          root="${BUNDLE:-$APPROOT}"
          : > /tmp/external.txt
          : > /tmp/core_missing.txt
          : > /tmp/plugin_missing.txt
          find "$root" -type f | while IFS= read -r f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            otool -D "$f" 2>/dev/null               | sed -n 's/^[[:space:]][[:space:]]*//p' | sort -u > /tmp/self.txt
            otool -L "$f" 2>/dev/null               | sed -n 's/^[[:space:]][[:space:]]*//p'               | sed 's/ (compatibility.*$//' | sort -u               | while IFS= read -r dep; do
              [ -z "$dep" ] && continue
              grep -Fxq "$dep" /tmp/self.txt && continue
              [ "${dep##*/}" = "${f##*/}" ] && continue
              case "$dep" in
                /usr/lib/*|/System/*) ;;
                @rpath/*|@loader_path/*|@executable_path/*)
                  base=${dep##*/}
                  if [ -z "$(find "$root" -name "$base" -print -quit)" ]; then
                    case "$f" in
                      */Contents/PlugIns/*|*/Contents/Resources/*)
                        echo "${f#$root/}  ->  $dep" >> /tmp/plugin_missing.txt ;;
                      *)
                        echo "${f#$root/}  ->  $dep" >> /tmp/core_missing.txt ;;
                    esac
                  fi
                  ;;
                *) echo "${f#$root/}  ->  $dep" >> /tmp/external.txt ;;
              esac
            done
          done
          if [ -s /tmp/plugin_missing.txt ]; then
            echo "note: optional Qt plugins whose frameworks were not deployed."
            echo "These belong to QML modules the app never imports; Qt skips a"
            echo "plugin it cannot load, so they are dead weight rather than a fault."
            sort -u /tmp/plugin_missing.txt | sed 's/^/  /' | head -40
            echo ""
          fi
          fail=0
          if [ -s /tmp/external.txt ]; then
            echo "*** links outside the package (will break on another Mac) ***"
            sort -u /tmp/external.txt
            fail=1
          fi
          if [ -s /tmp/core_missing.txt ]; then
            echo "*** an executable or framework needs something not in the package ***"
            sort -u /tmp/core_missing.txt
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "self-contained: executables and frameworks resolve inside the bundle"
          fi
          exit $fail

      - name: Check the bundle declares microphone access
        if: always()
        run: |
          set -e
          plist="${BUNDLE:-}/Contents/Info.plist"
          if [ -z "${BUNDLE:-}" ] || [ ! -f "$plist" ]; then
            echo "*** no .app bundle: macOS will never grant microphone access ***"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$plist"             || { echo "*** Info.plist has no NSMicrophoneUsageDescription ***"; exit 1; }
          echo "bundle declares microphone usage"

      - name: Launch and check dyld can load everything
        if: always()
        run: |
          set -e
          root="$APPROOT"
          for name in "Ulti-Jarvis-Settings" "Ulti-Jarvis-Daemon"; do
            exe="$root/$name"
            test -x "$exe" || { echo "missing executable: $name"; exit 1; }
            echo "--- $name ---"
            out=$("$exe" 2>&1 & pid=$!; sleep 8; kill $pid 2>/dev/null; wait $pid 2>/dev/null; true)
            echo "$out" | head -20
            if echo "$out" | grep -qE "Library not loaded|image not found|Symbol not found"; then
              echo "FAIL: $name could not resolve a library"; exit 1
            fi
            echo "$name: no dyld resolution errors"
          done

  linux-cleanroom:
    needs: linux
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.all_platforms)
      || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Prepare the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates file findutils

      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkg

      - name: Install the .deb the way a user would
        run: |
          set -e
          deb=$(find pkg -name '*.deb' | head -1)
          test -n "$deb" || { echo "no .deb in artifact"; exit 1; }
          echo "installing $deb"
          apt-get update
          apt-get install -y "$PWD/$deb"

      - name: Refuse to pass if Qt came from the distribution
        run: |
          set -e
          if dpkg-query -W -f '${Package}\n' 2>/dev/null | grep -qE '^libqt6'; then
            echo "*** a distribution Qt package was pulled in, so the package is not self-contained ***"
            dpkg-query -W -f '${Package}\n' | grep -E '^libqt6'
            exit 1
          fi
          echo "no distribution Qt packages are installed"

      - name: Check every installed binary resolves its libraries
        run: |
          set -e
          root=/usr/lib/ultijarvis
          test -d "$root" || { echo "package did not install to $root"; exit 1; }
          : > /tmp/missing.txt
          find "$root" -type f | while IFS= read -r f; do
            file -b "$f" | grep -q 'ELF' || continue
            ldd "$f" 2>/dev/null | grep 'not found' | while read -r line; do
              echo "${f#$root/}  ->  $line" >> /tmp/missing.txt
            done
          done
          if [ -s /tmp/missing.txt ]; then
            echo "*** unresolved shared libraries after a clean install ***"
            sort -u /tmp/missing.txt
            exit 1
          fi
          echo "every installed binary resolves all of its libraries"

      - name: Check the Qt runtime is the bundled one
        run: |
          set -e
          root=/usr/lib/ultijarvis
          for f in qt.conf plugins/platforms/libqxcb.so \
                   plugins/imageformats/libqsvg.so libQt6Core.so.6 \
                   libQt6Gui.so.6 libQt6Quick.so.6 libQt6XcbQpa.so.6; do
            test -e "$root/$f" || { echo "*** the package is missing $f ***"; exit 1; }
          done
          echo "the Qt runtime ships inside the package"

      - name: Start the settings window against the bundled Qt
        run: |
          set -e
          cd /usr/lib/ultijarvis
          QT_QPA_PLATFORM=offscreen ./Ulti-Jarvis-Settings &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            echo "the settings window stayed up on a machine with no Qt installed"
          else
            wait "$pid" || true
            echo "*** the settings window exited on its own ***"
            exit 1
          fi

  fedora-cleanroom:
    needs: linux
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.all_platforms)
      || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Prepare the container
        run: dnf install -y findutils file

      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkg

      - name: Install the .rpm the way a user would
        run: |
          set -e
          pkg=$(find pkg -name '*.rpm' | head -1)
          test -n "$pkg" || { echo "no .rpm in artifact"; exit 1; }
          echo "installing $pkg"
          dnf install -y "$PWD/$pkg"

      - name: Refuse to pass if Qt came from the distribution
        run: |
          set -e
          if rpm -qa --qf '%{NAME}\n' | grep -qiE '^qt6-'; then
            echo "*** a distribution Qt package was pulled in, so the package is not self-contained ***"
            rpm -qa --qf '%{NAME}\n' | grep -iE '^qt6-'
            exit 1
          fi
          echo "no distribution Qt packages are installed"

      - name: Check every installed binary resolves its libraries
        run: |
          set -e
          root=/usr/lib/ultijarvis
          test -d "$root" || { echo "package did not install to $root"; exit 1; }
          : > /tmp/missing.txt
          find "$root" -type f | while IFS= read -r f; do
            file -b "$f" | grep -q 'ELF' || continue
            ldd "$f" 2>/dev/null | grep 'not found' | while read -r line; do
              echo "${f#$root/}  ->  $line" >> /tmp/missing.txt
            done
          done
          if [ -s /tmp/missing.txt ]; then
            echo "*** unresolved shared libraries after a clean install ***"
            sort -u /tmp/missing.txt
            exit 1
          fi
          echo "every installed binary resolves all of its libraries"

      - name: Check the Qt runtime is the bundled one
        run: |
          set -e
          root=/usr/lib/ultijarvis
          for f in qt.conf plugins/platforms/libqxcb.so \
                   plugins/imageformats/libqsvg.so libQt6Core.so.6 \
                   libQt6Gui.so.6 libQt6Quick.so.6 libQt6XcbQpa.so.6; do
            test -e "$root/$f" || { echo "*** the package is missing $f ***"; exit 1; }
          done
          echo "the Qt runtime ships inside the package"

      - name: Start the settings window against the bundled Qt
        run: |
          set -e
          cd /usr/lib/ultijarvis
          QT_QPA_PLATFORM=offscreen ./Ulti-Jarvis-Settings &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            echo "the settings window stayed up on a machine with no Qt installed"
          else
            wait "$pid" || true
            echo "*** the settings window exited on its own ***"
            exit 1
          fi
