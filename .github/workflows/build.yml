name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Also build macOS and Windows (uses more Actions minutes)"
        type: boolean
        default: true

env:
  MODEL: ggml-small.en-q5_1.bin

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: lib
          key: linux-lib-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL }}
          key: whisper-${{ env.MODEL }}

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Install a C++26 compiler
        run: sudo apt-get install -y g++-14

      - name: Provide empty API key
        run: cp app/apikey.h.example app/apikey.h

      - name: Show runner resources
        run: free -h || true; df -h . || true; nproc || true

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --parallel 2

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: warn

  macos:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.all_platforms)
      || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: lib
          key: macos-lib-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL }}
          key: whisper-${{ env.MODEL }}

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Provide empty API key
        run: cp app/apikey.h.example app/apikey.h

      - name: Show runner resources
        run: free -h || true; df -h . || true; nproc || true

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --parallel 2

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*.tar.gz
          if-no-files-found: warn

  windows:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.all_platforms)
      || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git

      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: lib
          key: windows-lib-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL }}
          key: whisper-${{ env.MODEL }}

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Provide empty API key
        run: cp app/apikey.h.example app/apikey.h

      - name: Show runner resources
        run: free -h || true; df -h . || true; nproc || true

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --parallel 2

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: warn
